databases:
  - name: promo-db
    databaseName: promo_monitor
    user: promo_monitor
    plan: basic-256mb

services:
  - type: worker
    name: promo-worker
    runtime: node
    plan: 1c-2g
    rootDir: .
    buildCommand: npm ci && npm run build:worker
    preDeployCommand: npm run migrate
    startCommand: npm run start:worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: promo-db
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_TOKENS
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_API_URL
        sync: false
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_TO
        sync: false
      - key: FAST_LANE_INTERVAL_MS
        value: "90000"
      - key: SLOW_LANE_INTERVAL_MS
        value: "1200000"
      - key: WATCHLIST_INTERVAL_MS
        value: "300000"
      - key: SEARCH_PAGE_SIZE
        value: "100"
      - key: MAX_COMMIT_SEARCH_PAGES
        value: "10"
      - key: MAX_ISSUE_SEARCH_PAGES
        value: "10"
      - key: MAX_CODE_SEARCH_PAGES
        value: "5"
      - key: MAX_COMMIT_DETAILS_PER_SCAN
        value: "80"
      - key: MAX_CODE_FILES_PER_SCAN
        value: "40"
      - key: LIVE_COMMIT_WINDOW_DAYS
        value: "21"
      - key: MAX_FOLLOWED_REPOS_PER_SCAN
        value: "30"
      - key: FOLLOWED_REPO_COMMIT_PAGE_SIZE
        value: "30"
      - key: MAX_FOLLOWED_COMMIT_DETAILS_PER_REPO
        value: "15"
      - key: MAX_FOLLOWED_COMMIT_DETAILS_PER_SCAN
        value: "60"
      - key: BACKFILL_ENABLED
        value: "true"
      - key: APP_ENV
        value: production

  - type: web
    name: promo-dashboard
    runtime: node
    plan: 0.5c-512mb
    rootDir: .
    buildCommand: npm ci && npm run build:dashboard
    startCommand: npm run start:dashboard
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: promo-db
          property: connectionString
      - key: ADMIN_SECRET
        sync: false
      - key: APP_ENV
        value: production
